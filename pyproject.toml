[project]
name = "mfgkit"
version = "0.1.0"
description = "A manufacturing toolkit for control-system data: Aspen IP21, DeltaV, Intellution, and ControlLogix."
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.0",
    "numpy",
    "asyncua>=2.1.0",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
# The AspenTech SQLplus ODBC driver is Windows-only, so pyodbc is not a base
# dependency -- mfgkit.deltav and mfgkit.plc must stay installable on macOS.
aspen = ["pyodbc"]
# Event Chronicle and iFIX alarm databases over ODBC (mfgkit.eventlog).
sql = ["pyodbc"]
# Logic-graph construction and interactive plotting.
graph = ["networkx>=3.0", "plotly"]
excel = ["xlsxwriter", "openpyxl"]
# OPC UA client and practice server (mfgkit.opcua).
opcua = ["asyncua>=1.1"]
all = ["mfgkit[aspen,sql,graph,excel,opcua]"]
dev = ["mfgkit[graph,excel,opcua]", "pytest", "ipykernel"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mfgkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
